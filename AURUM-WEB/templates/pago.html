<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago Seguro | The Aurum Creations</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='imgs/favicon.png') }}">
</head>

<body data-page="pago">

    <div class="regresar-contenedor">
        <a href="javascript:history.back()" class="btn-regresar">
            <span>&#8592;</span> Volver a la tienda
        </a>
    </div>

    <nav class="navbar">
        <div class="logo">THE AURUM</div>
    </nav>
    <div class="linea-dorada"></div>

    <main class="pago-main">
        <section class="pago-container">

            <!-- ══ FORMULARIO ══ -->
            <div class="pago-form-sec">
                <h3>Detalles de Pago</h3>
                <form id="checkout-form">
                    <div class="input-group">
                        <label>Nombre en la tarjeta</label>
                        <input type="text" id="input-nombre" placeholder="NOMBRE APELLIDO" required>
                    </div>
                    <div class="input-group">
                        <label>Número de tarjeta</label>
                        <input type="text" id="input-numero" placeholder="0000 0000 0000 0000" maxlength="19" required>
                    </div>
                    <div class="flex-inputs">
                        <div class="input-group">
                            <label>Expiración</label>
                            <input type="text" id="input-exp" placeholder="MM/AA" maxlength="5" required>
                        </div>
                        <div class="input-group">
                            <label>CVV</label>
                            <input type="password" placeholder="123" maxlength="3" required>
                        </div>
                    </div>
                    <button type="submit" class="btn-confirmar">Pagar Ahora</button>
                </form>
            </div>

            <!-- ══ RESUMEN + TARJETA VISUAL ══ -->
            <div class="pago-resumen-sec">
                <div class="tarjeta-visual">
                    <div class="chip"></div>
                    <div id="card-logo-display" class="card-logo"></div>
                    <p class="numero-falso" id="card-number-display">0000 0000 0000 0000</p>
                    <div class="datos-falsos">
                        <div>
                            <small>TITULAR</small>
                            <div id="card-name-display">NOMBRE APELLIDO</div>
                        </div>
                        <div>
                            <small>EXP</small>
                            <div id="card-exp-display">MM/AA</div>
                        </div>
                    </div>
                </div>

                <div class="detalle-lista">
                    <h4>Resumen de pedido</h4>
                    <!--
                        script.js → initPago() lee localStorage
                        y renderiza los items aquí
                    -->
                    <div id="resumen-items"></div>
                    <hr>
                    <p class="total-pago">Total: <span id="monto-final">$0</span> MXN</p>
                </div>
            </div>

        </section>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
